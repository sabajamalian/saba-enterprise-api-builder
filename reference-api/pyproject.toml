[project]
name = "saba-reference-api"
version = "0.1.0"
description = "Local FastAPI reference for the hypothetical Saba Enterprise API standards"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "pyjwt[crypto]>=2.10,<3",
    "httpx>=0.28,<1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saba_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.local/pytest"
