name: Prepare API artifact source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.2"
      - run: uv sync --locked --python 3.12
      - run: echo "APM_BIN=$(uv run python scripts/install_apm.py)" >> "$GITHUB_ENV"
      - name: Validate and stage source package
        run: |
          uv run python -m unittest discover -s tests -v
          uv run python scripts/artifacts.py --check --consumer-test --export-source dist/source
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: saba-enterprise-api-builder-source
          path: dist/source/
          include-hidden-files: true
          if-no-files-found: error
