name: API Builder CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifacts:
    name: Artifact integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.2"
      - run: uv sync --locked --python 3.12
      - name: Install pinned APM
        run: echo "APM_BIN=$(uv run python scripts/install_apm.py)" >> "$GITHUB_ENV"
      - name: Check artifacts before any regeneration
        run: |
          uv run python -m unittest discover -s tests -v
          uv run python scripts/artifacts.py --check --consumer-test
  reference:
    name: Reference API contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reference-api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.2"
      - run: uv sync --locked --python 3.12
      - run: uv run pytest
